<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" >
    <!-- Pre-paint language sync: set <html lang> from the saved choice before
         i18n boots, so the browser never sees a lang/content mismatch.
         translate="no" + notranslate keep browser auto-translate off —
         this site ships its own English/हिन्दी switcher. -->
    <script>
      try {
        var isHi = location.pathname === '/hi' || location.pathname.indexOf('/hi/') === 0;
        document.documentElement.lang = isHi ? 'hi' : 'en';
      } catch (e) { /* storage unavailable — default lang="en" stands */ }
    </script>
    <meta name="google" content="notranslate" >
    <meta name="google-site-verification" content="oIRTPNzd-n2TMxyb0fUwvfM0mD8otNhfpNi-3PpJ98k" >
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <link rel="preconnect" href="https://fonts.googleapis.com" >
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin >
    <link rel="preconnect" href="https://vivahsambandh.com" crossorigin >
    <!-- LCP banner: preload with responsive candidates so the hero paints fast.
         1440w added: desktop (1350px viewport) was jumping from 1280w to 2172w (110KB).
         Now picks 1440w (~70KB) instead. Per perf.md Phase 7 desktop gap fix. -->
    <link
      rel="preload"
      as="image"
      href="/images/home/home_banner_image-640.webp"
      imagesrcset="/images/home/home_banner_image-640.webp 640w, /images/home/home_banner_image-1024.webp 1024w, /images/home/home_banner_image-1280.webp 1280w, /images/home/home_banner_image.webp 2172w"
      imagesizes="(max-width: 640px) 240px, (max-width: 1024px) 640px, 100vw"
      fetchpriority="high"
    >
    <!-- Google Fonts: async (non-render-blocking) + display=swap, no FOUT-blocking -->
    <link
      href="https://fonts.googleapis.com/css2?family=Gotu&family=Mukta:wght@400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    >
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Gotu&family=Mukta:wght@400;700&display=swap"
        rel="stylesheet"
      >
    </noscript>
    <title>VivahSambandh — Premium Community Matrimony</title>
  </head>
  <body>
    <!-- Boot placeholder: shown until the app mounts, but only on routes the
         build did not prerender (there #root is empty and the visitor would
         otherwise stare at a blank page). It sits outside #root because the
         prerender plugin inserts the prerendered body at the START of
         #root — anything inside would be duplicated below the real content.
         main.tsx removes it as soon as the app takes over. -->
    <div id="app-boot" class="app-boot" aria-hidden="true">
      <div class="app-boot__hero">
        <div class="app-boot__line app-boot__line--eyebrow"></div>
        <div class="app-boot__line app-boot__line--title"></div>
        <div class="app-boot__line app-boot__line--title app-boot__line--shorter"></div>
        <div class="app-boot__line app-boot__line--text"></div>
        <div class="app-boot__line app-boot__line--text app-boot__line--shorter"></div>
      </div>
      <div class="app-boot__grid">
        <div class="app-boot__card">
          <div class="app-boot__media"></div>
          <div class="app-boot__line"></div>
          <div class="app-boot__line app-boot__line--shorter"></div>
        </div>
        <div class="app-boot__card">
          <div class="app-boot__media"></div>
          <div class="app-boot__line"></div>
          <div class="app-boot__line app-boot__line--shorter"></div>
        </div>
        <div class="app-boot__card">
          <div class="app-boot__media"></div>
          <div class="app-boot__line"></div>
          <div class="app-boot__line app-boot__line--shorter"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
